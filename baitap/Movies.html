<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies - NetFlim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
      color: #222;
    }

    .navbar {
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .movie-card img {
      height: 350px;
      object-fit: cover;
      border-radius: 10px;
    }

    .movie-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    footer {
      margin-top: 50px;
      padding: 15px;
      background: #fff;
      text-align: center;
      color: #007bff;
      font-weight: 500;
      border-top: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="./flim.html"><i class="bi bi-film"></i> Home</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="./flim.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="./aboutus.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link active text-primary" href="./Movies.html">Movies</a></li>
        <li class="nav-item"><a class="nav-link" href="./favorites.html">Favorites</a></li>
      </ul>
      <form class="d-flex ms-3">
        <input class="form-control" type="search" placeholder="Search...">
      </form>
    </div>
  </nav>

  <!-- Movie Section -->
  <div class="container my-5">
    <h2 class="text-center text-primary fw-bold mb-4"><i class="bi bi-camera-reels"></i> Featured Movies</h2>

    <div class="row">
      <!-- The Post -->
      <div class="col-md-4 mb-4">
        <div class="card movie-card">
          <img src="https://upload.wikimedia.org/wikipedia/en/0/0b/The_Post_%28film%29.png" class="card-img-top" alt="The Post">
          <div class="card-body text-center">
            <h6>The Post</h6>
            <p>⭐⭐⭐⭐⭐</p>
          </div>
        </div>
      </div>

      <!-- The Godfather -->
      <div class="col-md-4 mb-4">
        <div class="card movie-card">
          <img src="https://upload.wikimedia.org/wikipedia/en/1/1c/Godfather_ver1.jpg" class="card-img-top" alt="The Godfather">
          <div class="card-body text-center">
            <h6>The Godfather</h6>
            <p>⭐⭐⭐⭐⭐</p>
          </div>
        </div>
      </div>

      <!-- Titanic -->
      <div class="col-md-4 mb-4">
        <div class="card movie-card">
          <img src="img/tải xuống (3).jpg" class="card-img-top" alt="Titanic">
          <div class="card-body text-center">
            <h6>Titanic</h6>
            <p>⭐⭐⭐⭐⭐</p>
          </div>
        </div>
      </div>

      <!-- The Lion King -->
      <div class="col-md-4 mb-4">
        <div class="card movie-card">
          <img src="https://upload.wikimedia.org/wikipedia/en/3/3d/The_Lion_King_poster.jpg" class="card-img-top" alt="Lion King">
          <div class="card-body text-center">
            <h6>The Lion King</h6>
            <p>⭐⭐⭐⭐⭐</p>
          </div>
        </div>
      </div>

      <!-- Avatar -->
      <div class="col-md-4 mb-4">
        <div class="card movie-card">
          <img src="img/tải xuống (2).jpg" class="card-img-top" alt="Avatar">
          <div class="card-body text-center">
            <h6>Avatar</h6>
            <p>⭐⭐⭐⭐⭐</p>
          </div>

          </div>
        </div>

  <footer>
    🎬 Blue Entertainment
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
