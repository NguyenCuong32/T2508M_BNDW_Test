<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - NetFilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .empty-favorites {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
            display: none; /* Hidden by default */
        }
        
        .empty-favorites i {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }
        
        .empty-favorites h2 {
            margin-bottom: 1rem;
            color: #333;
        }
        
        .empty-favorites p {
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: var(--primary-hover);
        }
        
        .filters {
            margin: 1.5rem 0;
        }
        
        .clear-filters {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 500;
        }
        
        .clear-filters:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎞️ NetFilm</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="favourites.html" class="active">Favorites</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Enter some keywords">
        </div>
    </header>

    <div class="main-container">
        <main class="movie-content">
            <h1>My Favorites</h1>
            <div class="filters">
                <div class="filter-tags" id="active-filters">
                    <span class="clear-filters" id="clear-filters">Clear all</span>
                </div>
            </div>
            <div class="movie-grid" id="favorites-grid">
                <!-- Favorites will be loaded here dynamically -->
            </div>
            <div class="empty-favorites" id="empty-favorites">
                <i class="far fa-heart"></i>
                <h2>Your favorites list is empty</h2>
                <p>Browse our collection and click the heart icon to add movies to your favorites.</p>
                <a href="movies.html" class="btn">Browse Movies</a>
            </div>
        </main>
    </div>

    <footer>
        🎞️ <span>Blue Entertainment</span>
    </footer>

    <script src="js/favorites.js"></script>
    <script>
        // Function to display favorites
        function displayFavorites() {
            const favoritesGrid = document.getElementById('favorites-grid');
            const emptyState = document.getElementById('empty-favorites');
            
            if (!favoritesGrid) return;
            
            // Get favorites from the module
            const favorites = window.favoritesModule ? window.favoritesModule.getFavorites() : [];
            
            if (!favorites || favorites.length === 0) {
                favoritesGrid.innerHTML = '';
                if (emptyState) emptyState.style.display = 'block';
                return;
            }
            
            if (emptyState) emptyState.style.display = 'none';
            
            // Generate HTML for each favorite movie
            favoritesGrid.innerHTML = favorites.map(movie => `
                <div class="movie-card" data-movie-id="${movie.id}">
                    <a href="${movie.href || '#'}" class="movie-link">
                        <div class="movie-poster">
                            <img src="${movie.poster || 'images/default-poster.jpg'}" alt="${movie.title}">
                            <button class="favorite-btn" data-movie-id="${movie.id}" aria-label="Remove from favorites">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                        <div class="movie-info">
                            <h3 class="movie-title">${movie.title}</h3>
                            <div class="movie-meta">
                                <span class="movie-year">${movie.year || ''}</span>
                                <span class="movie-category">${movie.categories ? movie.categories.join(', ') : ''}</span>
                            </div>
                            <div class="star-rating">
                                ${'★'.repeat(movie.rating || 5)}${'☆'.repeat(5 - (movie.rating || 5))}
                            </div>
                        </div>
                    </a>
                </div>
            `).join('');
            
            // Add event listeners to the favorite buttons
            document.querySelectorAll('.favorite-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const movieId = this.getAttribute('data-movie-id');
                    const movie = favorites.find(m => m.id === movieId);
                    if (movie && window.favoritesModule) {
                        window.favoritesModule.removeFromFavorites(movieId);
                    }
                });
            });
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initial display of favorites
            displayFavorites();
            
            // Handle search functionality
            const searchInput = document.querySelector('.search-bar input');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const searchTerm = this.value.toLowerCase();
                    const movieCards = document.querySelectorAll('#favorites-grid .movie-card');
                    let hasResults = false;
                    
                    movieCards.forEach(card => {
                        const title = card.querySelector('.movie-title')?.textContent.toLowerCase() || '';
                        if (title.includes(searchTerm)) {
                            card.style.display = '';
                            hasResults = true;
                        } else {
                            card.style.display = 'none';
                        }
                    });
                    
                    const emptyState = document.getElementById('empty-favorites');
                    if (emptyState) {
                        emptyState.style.display = hasResults || searchTerm === '' ? 'none' : 'block';
                    }
                });
            }
            
            // Clear filters button
            const clearFiltersBtn = document.getElementById('clear-filters');
            if (clearFiltersBtn) {
                clearFiltersBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const input = document.querySelector('.search-bar input');
                    if (input) input.value = '';
                    displayFavorites();
                });
            }
            
            // Listen for storage events (from other tabs)
            window.addEventListener('storage', function(e) {
                if (e.key === 'favorites') {
                    displayFavorites();
                }
            });
            
            // Listen for custom events (from same tab)
            window.addEventListener('favoritesUpdated', displayFavorites);
        });
    </script>
</body>
</html>
