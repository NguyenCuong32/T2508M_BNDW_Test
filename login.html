<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - RopFilm</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #000;
      padding: 10px 40px;
    }

    header img {
      height: 50px;
    }

    header button {
      background-color: #f1c40f;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    header button:hover {
      background-color: #d4ac0d;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }

    .login-box {
      background-color: #1a1a1a;
      padding: 40px;
      border-radius: 12px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
    }

    .login-box h2 {
      color: #f1c40f;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
      font-size: 1rem;
    }

    .login-box button {
      width: 100%;
      background-color: #f1c40f;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .login-box button:hover {
      background-color: #d4ac0d;
    }

    .login-box p {
      margin-top: 15px;
      color: #aaa;
    }

    .login-box a {
      color: #f1c40f;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background-color: #000;
      text-align: center;
      padding: 20px 0;
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="final.html"><img src="/images/logo.jpg" alt="RopFilm Logo"></a>
    </div>
    <div class="nav">
      <button onclick="location.href='final.html'">Trang chủ</button>
      <button onclick="location.href='about.html'">Giới thiệu</button>
    </div>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>Đăng Nhập</h2>
      <form>
        <input type="text" placeholder="Tên đăng nhập" required>
        <input type="password" placeholder="Mật khẩu" required>
        <button type="submit">Đăng nhập</button>
      </form>
      <p>Bạn chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 RopFilm. Tất cả các quyền được bảo lưu.</p>
  </footer>
</body>
</html>
