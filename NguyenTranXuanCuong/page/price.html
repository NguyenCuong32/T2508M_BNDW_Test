<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flakes - Pricing</title>
    <link rel="stylesheet" href="../css/price.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Sen:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
</head>

<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container">
                <h1 class="logo">flakes</h1>
            </div>
            <div class="menu-container">
                <ul class="menu-list">
                    <li class="menu-list-item active"><a href="../index.html">Home</a></li>
                    <li class="menu-list-item"><a href="./price.html">Price</a></li>
                    <li class="menu-list-item"><a href="./about.html">About Us</a></li>
                    <li class="menu-list-item"><a href="./contact.html">Contact</a></li>
                </ul>
            </div>
            <div class="profile-container">
                <img class="profile-picture" src="../img/profile2.jpg" alt="profile" />
                <div class="profile-text-container">
                    <span class="profile-text">Profile</span>
                    <i class="fas fa-caret-down"></i>
                </div>
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="content-container">
            <h1 class="pricing-title">Choose Your Plan</h1>
            <div class="pricing-cards">
                <div class="pricing-card">
                    <h2>Basic</h2>
                    <p class="price">$5<span>/month</span></p>
                    <ul>
                        <li>720p Resolution</li>
                        <li>1 Screen</li>
                        <li>Standard Sound</li>
                    </ul>
                    <button class="btn">Choose</button>
                </div>

                <div class="pricing-card popular">
                    <h2>Standard</h2>
                    <p class="price">$10<span>/month</span></p>
                    <ul>
                        <li>1080p Resolution</li>
                        <li>2 Screens</li>
                        <li>Dolby Audio</li>
                    </ul>
                    <button class="btn">Choose</button>
                    <span class="badge">Most Popular</span>
                </div>

                <div class="pricing-card">
                    <h2>Premium</h2>
                    <p class="price">$15<span>/month</span></p>
                    <ul>
                        <li>4K HDR</li>
                        <li>4 Screens</li>
                        <li>Dolby Atmos</li>
                    </ul>
                    <button class="btn">Choose</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/price.js"></script>
</body>

</html>
