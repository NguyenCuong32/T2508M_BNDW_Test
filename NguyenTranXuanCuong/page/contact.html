<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flakes - Contact</title>
    <link rel="stylesheet" href="../css/contact.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Sen:wght@700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container">
                <h1 class="logo">flakes</h1>
            </div>
            <div class="menu-container">
                <ul class="menu-list">
                    <li class="menu-list-item"><a href="../index.html">Home</a></li>
                    <li class="menu-list-item"><a href="./price.html">Price</a></li>
                    <li class="menu-list-item"><a href="./about.html">About Us</a></li>
                    <li class="menu-list-item active"><a href="./contact.html">Contact</a></li>
                </ul>
            </div>
            <div class="profile-container">
                <img class="profile-picture" src="../img/profile2.jpg" alt="profile" />
                <div class="profile-text-container">
                    <span class="profile-text">Profile</span>
                    <i class="fas fa-caret-down"></i>
                </div>
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="container">
        <div class="content-container">
            <h1 class="contact-title">Get in Touch</h1>
            <p class="contact-desc">
                Have a question, suggestion, or partnership idea? We'd love to hear
                from you!
            </p>

            <div class="contact-wrapper">
                <!-- Contact Form -->
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required />
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>
                    </div>

                    <button type="submit" class="btn">Send Message</button>
                </form>

                <!-- Contact Info -->
                <div class="contact-info">
                    <h2>Contact Info</h2>
                    <p><i class="fas fa-map-marker-alt"></i> 123 Flakes Studio, Hanoi</p>
                    <p><i class="fas fa-envelope"></i> support@flakes.com</p>
                    <p><i class="fas fa-phone-alt"></i> +84 899939682</p>

                    <div class="social-icons">
                        <a href="https://www.facebook.com/NTXC512" target="_blank"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../script/contact.js"></script>
</body>

</html>
