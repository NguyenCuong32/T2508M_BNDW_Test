<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KhoaFilm — Phim chiếu rạp 2025</title>

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS chung -->
    <link href="../css/khoafilm.css" rel="stylesheet" />
  </head>
  <body>
    <!-- ===== Navbar (menu: Home / About / Favorites / Contact) ===== -->
    <nav class="navbar navbar-expand-lg kf-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">
          <i class="bi bi-film me-1"></i> KhoaFilm
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="favorites.html">Favorites</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ===== Banner: Carousel to (auto lấy từ movies.json) ===== -->
    <section class="bg-dark border-bottom border-secondary">
      <div
        id="heroCarousel"
        class="carousel slide carousel-fade"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner" id="heroSlides">
          <!-- home.js sẽ render 3 slide từ movies.json -->
          <!-- Fallback (hiện khi JS chưa chạy) -->
          <div class="carousel-item active" style="height: 65vh">
            <div
              class="h-100 d-flex align-items-center justify-content-center text-center"
            >
              <div>
                <div class="spinner-border text-light mb-3" role="status"></div>
                <p class="text-white-50 mb-0">Đang tải banner…</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Nút điều hướng -->
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Prev</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>

        <!-- Chấm chỉ số -->
        <div class="carousel-indicators" id="heroIndicators"></div>
      </div>
    </section>

    <!-- ===== Danh sách đề xuất (2 cột) ===== -->
    <main class="kf-section">
      <div class="container">
        <h2 class="fw-bold mb-3 text-center">Đề xuất hôm nay</h2>
        <p class="text-center text-white-50 mb-4">
          Danh sách gợi ý theo xu hướng & đánh giá cao.
        </p>
        <div id="movieList" class="kf-grid"></div>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="kf-footer">
      <div class="container">
        © 2025 <strong>KhoaFilm</strong> — Trailer: YouTube • Dữ liệu:
        movies.json
      </div>
    </footer>

    <!-- ===== Modal Trailer (dùng chung) ===== -->
    <div
      class="modal fade kf-modal"
      id="trailerModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content border-0">
          <button
            type="button"
            class="btn-close btn-close-white ms-auto me-2 mt-2"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
          <div class="modal-body p-0">
            <div class="ratio ratio-16x9">
              <iframe
                id="trailerFrame"
                src=""
                title="Trailer"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Scripts ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- home.js: build banner từ movies.json & nút Trailer/Xem phim trên banner -->
    <script src="../js/home.js"></script>
    <!-- movies.js: render list 2 cột bên dưới -->
    <script src="../js/movies.js"></script>
  </body>
</html>
