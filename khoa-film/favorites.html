<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KhoaFilm — Đã xem gần đây</title>

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS chung -->
    <link href="../css/khoafilm.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg kf-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">
          <i class="bi bi-film me-1"></i> KhoaFilm
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="favorites.html">Favorites</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Header -->
    <header class="kf-hero py-5">
      <div class="container text-center">
        <h1 class="display-6 fw-bold mb-2">Phim đã xem gần đây</h1>
        <p class="mb-0 text-white-50">
          Danh sách tự cập nhật khi bạn bấm <strong>“Xem phim”</strong> ở trang
          chủ hoặc trang chi tiết.
        </p>
      </div>
    </header>

    <!-- Danh sách -->
    <main class="kf-section">
      <div class="container">
        <div id="recentList" class="kf-grid"></div>
        <p id="recentEmpty" class="text-center text-secondary mt-4 d-none">
          Chưa có phim nào được xem gần đây.
        </p>

        <!-- Optional: Xóa lịch sử -->
        <div class="text-center mt-4">
          <button id="clearRecent" class="btn btn-outline-light btn-sm">
            🧹 Xóa lịch sử đã xem
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="kf-footer">
      <div class="container">
        © 2025 KhoaFilm — Danh sách phim đã xem gần đây
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/recent.js"></script>
    <script>
      // nút xóa lịch sử
      document.getElementById("clearRecent").addEventListener("click", () => {
        localStorage.removeItem("KF_RECENTS");
        location.reload();
      });
    </script>
  </body>
</html>
