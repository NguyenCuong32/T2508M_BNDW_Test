<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liên hệ — KhoaFilm</title>

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS chung -->
    <link href="../css/khoafilm.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg kf-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">
          <i class="bi bi-film me-1"></i> KhoaFilm
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMain"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="favorites.html">Favorites</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header class="kf-hero py-5">
      <div class="container text-center">
        <h1 class="display-6 fw-bold mb-2">Liên hệ với KhoaFilm</h1>
        <p class="text-white-50 mb-0">
          Mọi góp ý hoặc hợp tác đều được chào đón 🎬
        </p>
      </div>
    </header>

    <!-- Form liên hệ -->
    <main class="kf-section">
      <div class="container" style="max-width: 600px">
        <form class="bg-dark p-4 rounded-3 border border-secondary shadow-sm">
          <div class="mb-3">
            <label class="form-label text-white">Họ và tên</label>
            <input
              type="text"
              class="form-control"
              placeholder="Nhập họ tên của bạn"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label text-white">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="example@gmail.com"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label text-white">Nội dung</label>
            <textarea
              class="form-control"
              rows="4"
              placeholder="Lời nhắn của bạn..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-danger w-100">
            Gửi liên hệ
          </button>
        </form>

        <div class="text-center mt-4 text-white-50">
          <p class="mb-1">
            <i class="bi bi-envelope"></i> admin@dokhacgiakhoa.vn
          </p>
          <p class="mb-0"><i class="bi bi-geo-alt"></i> Hà Nội, Việt Nam</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="kf-footer">
      <div class="container">
        © 2025 KhoaFilm — Liên hệ & góp ý:
        <a href="mailto:admin@dokhacgiakhoa.vn">admin@dokhacgiakhoa.vn</a>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
